<section class="panel distribution-panel" data-zipf-chart><div class="section-heading-row chart-heading"><div><span class="section-kicker">ONE PIPELINE · TWO DOMAINS</span><h2>Compare distributions</h2></div><label class="fit-toggle"><input type="checkbox" data-show-fit checked> Show regression on Log–log</label></div><fieldset class="series-picker" data-series-picker><legend>Lines to display</legend>{% for group in domain_groups %}<label><input type="checkbox" value="{{ group.key }}" data-series checked><i class="legend-dot condition-{{ group.key }}"></i><span>Domain {{ group.key }} · {{ group.name }}</span></label>{% endfor %}</fieldset><div class="dual-chart-grid"><article class="chart-card"><div class="chart-card-heading"><div><span class="section-kicker">LINEAR AXES</span><h3>Rank–frequency</h3></div><button type="button" class="text-link" data-save-chart="frequency">Save SVG ↓</button></div><div class="chart-container" data-chart-container="frequency"><svg data-chart-svg="frequency" role="img" aria-label="Domain rank-frequency comparison"></svg><div class="chart-tooltip" data-chart-tooltip="frequency" hidden></div></div></article><article class="chart-card"><div class="chart-card-heading"><div><span class="section-kicker">LOGARITHMIC VIEW</span><h3>Log–log</h3></div><button type="button" class="text-link" data-save-chart="log">Save SVG ↓</button></div><div class="chart-container" data-chart-container="log"><svg data-chart-svg="log" role="img" aria-label="Domain log-log comparison"></svg><div class="chart-tooltip" data-chart-tooltip="log" hidden></div></div></article></div><div class="chart-legend">{% for group in domain_groups %}<span data-series-legend="{{ group.key }}"><i class="legend-dot condition-{{ group.key }}"></i>Domain {{ group.key }} · {{ group.name }}</span>{% endfor %}<span class="chart-note">Hover over either chart for term details.</span></div></section>

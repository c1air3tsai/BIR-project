# Docker 執行設定：docker compose up --build 後開 http://127.0.0.1:8001/
# data/ 與 docs/ 掛載到容器，資料庫、文章 XML、快取與 Project 3 實驗結果都會留在本機資料夾。
services:
  web:
    build: .
    init: true
    ports:
      # 預設 8001；要換 port 就在 .env 設定 BIOMEDIR_PORT
      - "0.0.0.0:${BIOMEDIR_PORT:-8001}:8000"
    volumes:
      # A bind mount keeps the database and uploaded XML in this project even
      # if containers or named volumes are recreated.
      - ./data:/app/data
      # Project 3 實驗輸出（docs/project3_results）直接寫回本機
      - ./docs:/app/docs
      - ./certs:/app/certs:ro
    environment:
      BIOMEDIR_DB: /app/data/db.sqlite3
      BIOMEDIR_EMBEDDING_CACHE: /app/data/embedding_cache
      BIOMEDIR_RETRIEVAL_CACHE: /app/data/retrieval_cache
      BIOMEDIR_CA_DIR: /app/certs
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
